name: cleanup-obsolete-config-once

on:
  push:
    branches: [feature/hybrid-odds-vision]
    paths: [.github/workflows/cleanup-obsolete-config-once.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hybrid-odds-vision
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Remove dead configuration surface
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('xbet_config.py')
          src = p.read_text(encoding='utf-8')

          # UrlConfig no longer requires or exposes table-tennis navigation.
          src = src.replace('    table_tennis_target: str\n', '')
          src = re.sub(
              r'        table_name = \(\n.*?\n        \)\n',
              '', src, count=1, flags=re.S,
          )
          src = re.sub(
              r'        table_tennis_target = _value\(source, table_name\)\n.*?        table_tennis_target = _validated_target\(table_tennis_target, table_name\)\n',
              '', src, count=1, flags=re.S,
          )
          src = src.replace('            table_tennis_target=table_tennis_target,\n', '')
          src = re.sub(
              r'\n    @property\n    def table_tennis_url\(self\) -> str:\n        return join_url\(self\.xbet_url, self\.table_tennis_target\)\n',
              '', src, count=1,
          )
          src = re.sub(
              r'\n    @property\n    def table_tennis_path\(self\) -> str:\n        return urlsplit\(self\.table_tennis_url\)\.path\n',
              '', src, count=1,
          )
          src = re.sub(
              r'\n    @property\n    def table_tennis_root_path\(self\) -> str:\n        return urlsplit\(self\.table_tennis_url\)\.path\.rstrip\("/"\)\n',
              '', src, count=1,
          )
          src = src.replace('            "table_tennis_path": self.table_tennis_path,\n', '')
          src = src.replace('            "table_tennis_url": self.table_tennis_url,\n', '')

          # SelectorConfig: remove fields used only by deleted tennis scanners.
          tennis_selector_fields = [
              'league_item', 'league_group', 'league_link_template', 'league_title',
              'league_games_count', 'accordion_trigger', 'market_content_item',
              'market_group_header', 'market_group_list', 'market_group_selection',
              'table_market_groups', 'table_market_titles', 'table_market_buttons',
          ]
          for name in tennis_selector_fields:
              src = re.sub(rf'^    {name}: .*\n', '', src, count=1, flags=re.M)
          constructor_map = {
              'league_item': 'one("SELECTOR_LEAGUE_ITEM")',
              'league_group': 'one("SELECTOR_LEAGUE_GROUP")',
              'league_link_template': 'one("SELECTOR_LEAGUE_LINK_TEMPLATE")',
              'league_title': 'one("SELECTOR_LEAGUE_TITLE")',
              'league_games_count': 'one("SELECTOR_LEAGUE_GAMES_COUNT")',
              'accordion_trigger': 'one("SELECTOR_ACCORDION_TRIGGER")',
              'market_content_item': 'one("SELECTOR_MARKET_CONTENT_ITEM")',
              'market_group_header': 'one("SELECTOR_MARKET_GROUP_HEADER")',
              'market_group_list': 'one("SELECTOR_MARKET_GROUP_LIST")',
              'market_group_selection': 'one("SELECTOR_MARKET_GROUP_SELECTION")',
              'table_market_groups': 'many("SELECTOR_TABLE_MARKET_GROUPS")',
              'table_market_titles': 'many("SELECTOR_TABLE_MARKET_TITLES")',
              'table_market_buttons': 'many("SELECTOR_TABLE_MARKET_BUTTONS")',
          }
          for name, expr in constructor_map.items():
              line = f'            {name}={expr},\n'
              if line not in src:
                  raise SystemExit(f'missing selector constructor line: {name}')
              src = src.replace(line, '', 1)

          # TextConfig: remove Total Even + table-tennis-only labels.
          dead_text_fields = [
              'total_even', 'total_even_search', 'affirmative_selection',
              'main_game', 'first_party', 'second_party', 'party_market_template',
              'player_one_aliases', 'player_two_aliases',
          ]
          for name in dead_text_fields:
              src = re.sub(rf'^    {name}: .*\n', '', src, count=1, flags=re.M)
          text_lines = [
              '            total_even=required("TEXT_TOTAL_EVEN"),\n',
              '            total_even_search=required("TEXT_TOTAL_EVEN_SEARCH"),\n',
              '            affirmative_selection=required("TEXT_AFFIRMATIVE_SELECTION"),\n',
              '            main_game=required("TEXT_MAIN_GAME"),\n',
              '            first_party=required("TEXT_FIRST_PARTY"),\n',
              '            second_party=required("TEXT_SECOND_PARTY"),\n',
              '            party_market_template=required("TEXT_PARTY_MARKET_TEMPLATE"),\n',
              '            player_one_aliases=split_config_list(required("TEXT_PLAYER_ONE_ALIASES")),\n',
              '            player_two_aliases=split_config_list(required("TEXT_PLAYER_TWO_ALIASES")),\n',
          ]
          for line in text_lines:
              if line not in src:
                  raise SystemExit(f'missing text config line: {line.strip()}')
              src = src.replace(line, '', 1)

          # RuntimeConfig: remove table-tennis polling/arbitrage settings.
          src = src.replace('    table_tennis_odds_poll_interval: float\n', '')
          src = src.replace('    table_tennis_min_arb_percent: float\n', '')
          src = re.sub(
              r'            table_tennis_odds_poll_interval=max\(\n                0\.5, float\(_value\(source, "TABLE_TENNIS_ODDS_POLL_INTERVAL"\) or "1\.5"\)\n            \),\n',
              '', src, count=1,
          )
          src = re.sub(
              r'            table_tennis_min_arb_percent=max\(\n                0\.0, float\(_value\(source, "TABLE_TENNIS_MIN_ARB_PERCENT"\) or "0\.5"\)\n            \),\n',
              '', src, count=1,
          )
          src = re.sub(
              r'\n\ndef get_table_tennis_url\(\) -> str:\n    return URL_CONFIG\.table_tennis_url\n',
              '', src, count=1,
          )
          src = re.sub(
              r'\n\ndef get_table_tennis_odds_poll_interval\(\) -> float:\n    return RUNTIME_CONFIG\.table_tennis_odds_poll_interval\n',
              '', src, count=1,
          )
          src = re.sub(
              r'\n\ndef get_table_tennis_min_arb_percent\(\) -> float:\n    return RUNTIME_CONFIG\.table_tennis_min_arb_percent\n',
              '', src, count=1,
          )

          compile(src, 'xbet_config.py', 'exec')
          forbidden = (
              'table_tennis', 'TABLE_TENNIS', 'total_even', 'TOTAL_EVEN',
              'TEXT_AFFIRMATIVE_SELECTION', 'TEXT_MAIN_GAME', 'TEXT_FIRST_PARTY',
              'TEXT_SECOND_PARTY', 'TEXT_PARTY_MARKET_TEMPLATE',
              'TEXT_PLAYER_ONE_ALIASES', 'TEXT_PLAYER_TWO_ALIASES',
          )
          leftovers = [token for token in forbidden if token in src]
          if leftovers:
              raise SystemExit(f'xbet_config leftovers: {leftovers}')
          p.write_text(src, encoding='utf-8')

          # .env.example must document only settings still used by runtime.
          p = Path('.env.example')
          env = p.read_text(encoding='utf-8')
          env = re.sub(r'^SITE_TABLE_TENNIS_URL=.*\n', '', env, flags=re.M)
          env = re.sub(r'^TEXT_TOTAL_EVEN=.*\n', '', env, flags=re.M)
          env = re.sub(r'^TEXT_TOTAL_EVEN_SEARCH=.*\n', '', env, flags=re.M)
          env = re.sub(r'^TEXT_AFFIRMATIVE_SELECTION=.*\n', '', env, flags=re.M)
          env = re.sub(r'\n# ==============================\n# TABLE TENNIS\n# ==============================\n.*?(?=\n# ==============================\n# BACKEND / FRONTEND PUBLIC URLS)', '', env, count=1, flags=re.S)
          env = re.sub(r'^TABLE_TENNIS_ODDS_POLL_INTERVAL=.*\n', '', env, flags=re.M)
          env = re.sub(r'^TABLE_TENNIS_MIN_ARB_PERCENT=.*\n', '', env, flags=re.M)
          p.write_text(env, encoding='utf-8')

          # URL tests no longer need a deleted product URL.
          p = Path('tests/test_url_config.py')
          tests = p.read_text(encoding='utf-8')
          tests = tests.replace('        "XBET_TABLE_TENNIS_PATH": "/live/table-tennis",\n', '')
          tests = re.sub(
              r'        self\.assertEqual\(\n            config\.table_tennis_url,\n            "https://new-mirror\.example/ru/live/table-tennis",\n        \)\n',
              '', tests, count=1,
          )
          p.write_text(tests, encoding='utf-8')
          PY

      - name: Verify no obsolete config dependency remains
        run: |
          python -m compileall -q backend tests xbet_config.py auth.py matches.py
          ! grep -n -E 'TABLE_TENNIS|table_tennis|TOTAL_EVEN|total_even|TEXT_AFFIRMATIVE_SELECTION|TEXT_MAIN_GAME|TEXT_FIRST_PARTY|TEXT_SECOND_PARTY|TEXT_PARTY_MARKET_TEMPLATE|TEXT_PLAYER_(ONE|TWO)_ALIASES' xbet_config.py .env.example

      - name: Install and run full tests
        run: |
          cp .env.example .env
          pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Build frontend
        working-directory: front/frontend
        run: |
          npm ci
          npm run build

      - name: Commit verified config cleanup
        run: |
          rm .github/workflows/cleanup-obsolete-config-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove obsolete betting strategy config"
          git push origin HEAD:feature/hybrid-odds-vision
