name: finalize-hybrid-state-once

on:
  push:
    branches: [feature/hybrid-odds-vision]
    paths: [.github/workflows/finalize-hybrid-state-once.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hybrid-odds-vision
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Normalize hybrid market state and docs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          state_path = Path('backend/app/demo/state.py')
          state = state_path.read_text(encoding='utf-8')
          old = '            "source": "DOM / Playwright",\n            "status": "WAITING",\n'
          new = '            "source": "HYBRID / DOM + Canvas Vision",\n            "status": "WAITING",\n'
          if state.count(old) != 1:
              raise SystemExit(f'state source guard: {state.count(old)}')
          state = state.replace(old, new, 1)
          state_path.write_text(state, encoding='utf-8')

          engine_path = Path('backend/app/demo/engine.py')
          engine = engine_path.read_text(encoding='utf-8')
          old_doc = '        """Wait for current DOM odds without losing the active match or score."""\n'
          new_doc = '        """Wait for current next-goal odds via DOM with Canvas Vision fallback."""\n'
          if engine.count(old_doc) != 1:
              raise SystemExit(f'engine doc guard: {engine.count(old_doc)}')
          engine = engine.replace(old_doc, new_doc, 1)

          old_message = '                f"Ждём DOM-рынок следующего гола №{next_goal_number}",\n'
          new_message = '                f"Ждём рынок следующего гола №{next_goal_number} (DOM / Canvas Vision)",\n'
          if engine.count(old_message) != 1:
              raise SystemExit(f'engine message guard: {engine.count(old_message)}')
          engine = engine.replace(old_message, new_message, 1)

          old_reader = '''                market_reader={
                    "source": "DOM / Playwright",
                    "status": "READING",
                    "attempt": attempt,
                    "next_goal_number": next_goal_number,
                },
                odds={
                    "selected": None,
                    "opponent": None,
                    "team1": None,
                    "team2": None,
                    "market": f"Следующий гол №{next_goal_number}",
                    "source": "DOM_PLAYWRIGHT",
                    "backend": None,
                    "confidence": None,
                    "status": "WAITING_FOR_MARKET",
                },
'''
          new_reader = '''                market_reader={
                    "source": "HYBRID / DOM + Canvas Vision",
                    "status": "READING",
                    "attempt": attempt,
                    "next_goal_number": next_goal_number,
                },
                odds={
                    "selected": None,
                    "opponent": None,
                    "team1": None,
                    "team2": None,
                    "market": f"Следующий гол №{next_goal_number}",
                    "source": None,
                    "backend": None,
                    "confidence": None,
                    "status": "WAITING_FOR_MARKET",
                },
'''
          if engine.count(old_reader) != 1:
              raise SystemExit(f'engine reader-state guard: {engine.count(old_reader)}')
          engine = engine.replace(old_reader, new_reader, 1)
          engine_path.write_text(engine, encoding='utf-8')
          compile(engine, 'backend/app/demo/engine.py', 'exec')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme, count = re.subn(
              r'\n## Вилки настольного тенниса \(DEMO\).*?(?=\n## Canvas OCR)',
              '',
              readme,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'README tennis section guard: {count}')
          readme = readme.replace(
              '## Canvas OCR\n\nОсновной движок — singleton `RapidOCR` (ONNX Runtime), fallback —\n`pytesseract`. Tesseract ищется через `TESSERACT_CMD`, `PATH` и стандартные\nWindows-каталоги. Отсутствие Tesseract не мешает работе RapidOCR.\n',
              '## Следующий гол: DOM + Canvas Vision\n\n'
              'Рабочий reader сначала использует DOM, если исходы рынка доступны как обычные\n'
              'элементы. Когда коэффициенты отрисованы в Canvas, автоматически включается\n'
              'машинное зрение: OpenCV + `RapidOCR` (ONNX Runtime), с `pytesseract` как\n'
              'fallback. Перед использованием коэффициентов проверяются стабильность двух\n'
              'чтений и номер следующего гола относительно текущего счёта. В LIVE координаты\n'
              'OCR переводятся в CSS-координаты Canvas перед открытием нужного исхода.\n',
          )
          readme_path.write_text(readme, encoding='utf-8')

          test_path = Path('tests/test_runtime_wiring.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '    def test_engine_uses_hybrid_market_reader(self):\n'
          if marker not in tests:
              raise SystemExit('runtime wiring test marker missing')
          extra = '''    def test_next_goal_wait_state_is_hybrid_not_dom_only(self):
        state_source = Path("backend/app/demo/state.py").read_text(encoding="utf-8")
        engine_source = Path("backend/app/demo/engine.py").read_text(encoding="utf-8")
        self.assertIn("HYBRID / DOM + Canvas Vision", state_source)
        self.assertIn("Ждём рынок следующего гола", engine_source)
        self.assertNotIn("Ждём DOM-рынок следующего гола", engine_source)

'''
          if 'test_next_goal_wait_state_is_hybrid_not_dom_only' not in tests:
              tests = tests.replace(marker, extra + marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Run full tests
        run: |
          cp .env.example .env
          pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Build frontend
        working-directory: front/frontend
        run: |
          npm ci
          npm run build

      - name: Commit verified finalization
        run: |
          rm .github/workflows/finalize-hybrid-state-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize hybrid Canvas market state"
          git push origin HEAD:feature/hybrid-odds-vision
