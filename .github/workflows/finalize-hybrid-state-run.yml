name: finalize-hybrid-state-run

on:
  push:
    branches:
      - feature/hybrid-odds-vision
    paths:
      - .github/workflows/finalize-hybrid-state-run.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hybrid-odds-vision
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply finalizer
        run: python tools/finalize_hybrid_state.py
      - name: Run full tests
        run: |
          cp .env.example .env
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Build frontend
        working-directory: front/frontend
        run: |
          npm ci
          npm run build
      - name: Commit verified finalization
        run: |
          rm tools/finalize_hybrid_state.py
          rm .github/workflows/finalize-hybrid-state-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize hybrid Canvas market state"
          git push origin HEAD:feature/hybrid-odds-vision
