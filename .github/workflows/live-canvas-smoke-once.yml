name: live-canvas-smoke-once

on:
  push:
    branches:
      - feature/hybrid-odds-vision
    paths:
      - .github/workflows/live-canvas-smoke-once.yml

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hybrid-odds-vision
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install 'playwright>=1.49,<2'
          python -m playwright install --with-deps chromium

      - name: Smoke current public match UI
        id: smoke
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          league_url = 'https://1xlite-6308.pro/ru/live/fifa/2860561-fc-25-3x3-conference-league'
          result = {
              'league_url': league_url,
              'http_status': None,
              'final_url': None,
              'match_links': 0,
              'opened_match': False,
              'market_search_inputs': 0,
              'canvas_count': 0,
              'error': None,
          }
          Path('smoke-artifacts').mkdir(exist_ok=True)

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page(viewport={'width': 1600, 'height': 1000})
                  response = page.goto(league_url, wait_until='domcontentloaded', timeout=60_000)
                  result['http_status'] = response.status if response else None
                  page.wait_for_timeout(5_000)
                  result['final_url'] = page.url

                  links = page.locator(
                      'a.ui-game-card__link, a.dashboard-game-block__link, '
                      'a[href*="/live/fifa/2860561-fc-25-3x3-conference-league/"]'
                  )
                  result['match_links'] = links.count()
                  page.screenshot(path='smoke-artifacts/league.png', full_page=False)

                  if result['match_links'] <= 0:
                      raise RuntimeError('MATCH_LINK_NOT_FOUND')

                  links.first.click(timeout=10_000)
                  page.wait_for_load_state('domcontentloaded', timeout=30_000)
                  page.wait_for_timeout(4_000)
                  result['opened_match'] = True

                  inputs = page.locator(
                      'input.ui-search-default__input[placeholder="Поиск по рынкам"], '
                      'input.ui-search-default__input, input.game-search__input'
                  )
                  visible_inputs = []
                  for index in range(inputs.count()):
                      item = inputs.nth(index)
                      if item.is_visible():
                          visible_inputs.append(item)
                  result['market_search_inputs'] = len(visible_inputs)

                  if visible_inputs:
                      market_input = visible_inputs[1] if len(visible_inputs) > 1 else visible_inputs[0]
                      market_input.fill('следующий гол')
                      page.wait_for_timeout(3_000)

                  result['canvas_count'] = page.locator('canvas.market-grid-canvas__canvas').count()
                  page.screenshot(path='smoke-artifacts/match.png', full_page=False)
                  browser.close()

                  if result['market_search_inputs'] <= 0:
                      raise RuntimeError('MARKET_SEARCH_NOT_FOUND')
                  if result['canvas_count'] <= 0:
                      raise RuntimeError('MARKET_CANVAS_NOT_FOUND')
          except Exception as error:
              result['error'] = f'{type(error).__name__}: {error}'

          Path('smoke-artifacts/result.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, ensure_ascii=False))
          raise SystemExit(1 if result['error'] else 0)
          PY
          code=$?
          echo "$code" > /tmp/live_canvas_smoke_code
          exit 0

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-canvas-smoke
          path: smoke-artifacts/
          if-no-files-found: warn
          retention-days: 3

      - name: Remove one-time workflow
        if: always()
        run: |
          rm .github/workflows/live-canvas-smoke-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/live-canvas-smoke-once.yml
          git commit -m "Remove one-time live Canvas smoke workflow"
          git push origin HEAD:feature/hybrid-odds-vision

      - name: Enforce smoke result
        if: always()
        run: |
          test "$(cat /tmp/live_canvas_smoke_code)" = "0"
