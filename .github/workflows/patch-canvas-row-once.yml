name: patch-canvas-row-once

on:
  push:
    branches:
      - feature/hybrid-odds-vision
    paths:
      - .github/workflows/patch-canvas-row-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hybrid-odds-vision
          fetch-depth: 0

      - name: Apply guarded patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/browser/canvas_vision.py')
          source = path.read_text(encoding='utf-8')

          old_center = '        center_y = (first["y"] + second["y"]) / 2\n'
          new_center = (
              '        first_center_y = first["y"] + first["height"] / 2\n'
              '        second_center_y = second["y"] + second["height"] / 2\n'
              '        center_y = (first_center_y + second_center_y) / 2\n'
          )
          if source.count(old_center) != 1:
              raise SystemExit(
                  f'center guard failed: found {source.count(old_center)} occurrences'
              )
          source = source.replace(old_center, new_center, 1)

          old_goals = (
              '        goal1 = _goal_label(side1_labels[0], 1)\n'
              '        goal2 = _goal_label(side2_labels[0], 2)\n'
          )
          new_goals = (
              '        # OCR can see labels from adjacent goal rows at once. Bind each\n'
              '        # odds row to the vertically nearest team label. Do not force the\n'
              '        # expected goal here: a genuinely stale market must stay stale.\n'
              '        side1_labels.sort(\n'
              '            key=lambda item: (\n'
              '                abs(item["y"] + item["height"] / 2 - center_y),\n'
              '                -float(item.get("confidence", 0.0)),\n'
              '            )\n'
              '        )\n'
              '        side2_labels.sort(\n'
              '            key=lambda item: (\n'
              '                abs(item["y"] + item["height"] / 2 - center_y),\n'
              '                -float(item.get("confidence", 0.0)),\n'
              '            )\n'
              '        )\n'
              '        goal1 = _goal_label(side1_labels[0], 1)\n'
              '        goal2 = _goal_label(side2_labels[0], 2)\n'
          )
          if source.count(old_goals) != 1:
              raise SystemExit(
                  f'goal guard failed: found {source.count(old_goals)} occurrences'
              )
          source = source.replace(old_goals, new_goals, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify regression test
        run: |
          cp .env.example .env
          python -m pip install --quiet -r requirements.txt
          python -m unittest tests.test_canvas_goal_row_mapping -v

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/patch-canvas-row-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/browser/canvas_vision.py .github/workflows/patch-canvas-row-once.yml
          git commit -m "Harden canvas next-goal row mapping"
          git push origin HEAD:feature/hybrid-odds-vision
