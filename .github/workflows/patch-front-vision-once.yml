name: patch-front-vision-once

on:
  push:
    branches:
      - feature/hybrid-odds-vision
    paths:
      - .github/workflows/patch-front-vision-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hybrid-odds-vision
          fetch-depth: 0

      - name: Patch frontend vision metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('front/frontend/src/App.vue')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "  market_reader: { source: 'DOM / Playwright', status: 'WAITING', attempt: 0 },",
                  "  market_reader: { source: null, status: 'WAITING', attempt: 0 },",
              ),
              (
                  "const marketReader = computed(() => state.value.market_reader || {})\n\nconst budget = computed(() => state.value.budget || {})",
                  "const marketReader = computed(() => state.value.market_reader || {})\n\n"
                  "const marketSource = computed(() => state.value.odds?.source || marketReader.value.source || null)\n\n"
                  "const marketBackend = computed(() => state.value.odds?.backend || state.value.odds?.ocr_backend || null)\n\n"
                  "const marketConfidence = computed(() => {\n"
                  "  const value = Number(state.value.odds?.confidence)\n"
                  "  if (!Number.isFinite(value)) return null\n"
                  "  const normalized = value <= 1 ? value * 100 : value\n"
                  "  return `${Math.round(normalized)}%`\n"
                  "})\n\n"
                  "const marketReadDescription = computed(() => {\n"
                  "  const source = String(marketSource.value || '').toUpperCase()\n"
                  "  if (source.includes('CANVAS')) return 'Коэффициенты распознаются машинным зрением по Canvas; DOM используется для навигации и как резервный источник.'\n"
                  "  if (source.includes('DOM')) return 'Коэффициенты прочитаны из DOM.'\n"
                  "  return 'Ожидаем источник коэффициентов.'\n"
                  "})\n\n"
                  "const budget = computed(() => state.value.budget || {})",
              ),
              (
                  "<strong>{{ show(marketReader.source, 'DOM / Playwright') }}</strong>",
                  "<strong>{{ show(marketSource, 'Ожидаем данные') }}</strong>",
              ),
              (
                  "<strong>{{ show(marketReader.source, 'DOM / Playwright') }} · попытка {{ marketReader.attempt || 0 }}</strong>\n\n                <small>Рынки читаются напрямую через Playwright DOM.</small>",
                  "<strong>{{ show(marketSource, 'WAITING') }} · попытка {{ marketReader.attempt || 0 }}</strong>\n\n                <small>{{ marketReadDescription }}</small>",
              ),
              (
                  "              <div v-if=\"!isFirstHalfDraw && state.strategy_type !== 'TOTAL_EVEN'\">\n\n                <span>СЛЕДУЮЩИЙ ГОЛ</span>",
                  "              <div v-if=\"marketBackend || marketConfidence\">\n\n                <span>МАШИННОЕ ЗРЕНИЕ</span>\n\n                <strong>{{ show(marketBackend, 'OCR') }} · {{ show(marketConfidence) }}</strong>\n\n              </div>\n\n              <div v-if=\"!isFirstHalfDraw && state.strategy_type !== 'TOTAL_EVEN'\">\n\n                <span>СЛЕДУЮЩИЙ ГОЛ</span>",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'guard failed for {old[:60]!r}: found {count}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/patch-front-vision-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add front/frontend/src/App.vue .github/workflows/patch-front-vision-once.yml
          git commit -m "Show Canvas vision state on betting frontend"
          git push origin HEAD:feature/hybrid-odds-vision
