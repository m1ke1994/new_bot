name: remove-obsolete-strategies-final

on:
  push:
    branches: [feature/hybrid-odds-vision]
    paths: [.github/workflows/remove-obsolete-strategies-final.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hybrid-odds-vision
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Remove Total Even and tennis forks
        run: |
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          def remove_nodes(path, names, node_types):
              p = Path(path)
              src = p.read_text(encoding='utf-8')
              tree = ast.parse(src)
              spans = []
              found = set()
              for node in ast.walk(tree):
                  if isinstance(node, node_types) and getattr(node, 'name', None) in names:
                      start = min([node.lineno, *[d.lineno for d in getattr(node, 'decorator_list', [])]])
                      spans.append((start, node.end_lineno))
                      found.add(node.name)
              missing = set(names) - found
              if missing:
                  raise SystemExit(f'{path}: missing nodes {sorted(missing)}')
              lines = src.splitlines(keepends=True)
              for start, end in sorted(spans, reverse=True):
                  del lines[start - 1:end]
                  while start - 1 < len(lines) and lines[start - 1].strip() == '':
                      del lines[start - 1]
              result = ''.join(lines)
              ast.parse(result)
              p.write_text(result, encoding='utf-8')

          def replace_required(src, old, new, label):
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {count}')
              return src.replace(old, new, 1)

          # engine: remove only obsolete branches/methods; preserve NEXT_GOAL/FIRST_HALF_DRAW.
          p = Path('backend/app/demo/engine.py')
          src = p.read_text(encoding='utf-8')
          src = replace_required(src, '    read_next_goal_odds,\n    read_total_even_market,\n', '    read_next_goal_odds,\n', 'market import')
          src, n = re.subn(r'from \.strategies\.total_even import \(\n.*?\n\)\n', '', src, count=1, flags=re.S)
          if n != 1: raise SystemExit('total_even import block not found')
          src = replace_required(src,
              '    if strategy_type == StrategyType.TOTAL_EVEN:\n        return TOTAL_EVEN_MARKET_NAME, TOTAL_EVEN_SELECTION\n',
              '', 'presentation branch')
          tennis_guard = (
              '        # The read-only table-tennis scanner shares this exact Playwright page.\n'
              '        # Never let two independent workflows navigate it concurrently.\n'
              '        from backend.app.table_tennis.scanner import TABLE_TENNIS_SCANNER\n\n'
              '        if TABLE_TENNIS_SCANNER.scanning:\n'
              '            raise ModeConflictError(\n'
              '                "Сначала остановите DEMO «Вилки» и общий Playwright browser."\n'
              '            )\n'
          )
          src = replace_required(src, tennis_guard, '', 'tennis guard')
          live_guard = (
              '            if (\n'
              '                requested_mode == "LIVE"\n'
              '                and self._config.strategy_type == StrategyType.TOTAL_EVEN\n'
              '            ):\n'
              '                raise ModeConflictError(\n'
              '                    "Стратегия «Тотал чёт» пока доступна только в DEMO."\n'
              '                )\n'
          )
          src = replace_required(src, live_guard, '', 'live total-even guard')
          src = replace_required(src,
              '        if self._config.strategy_type == StrategyType.TOTAL_EVEN:\n            await self._process_total_even_match(page)\n            return\n',
              '', 'total-even dispatch')
          snapshot_block = (
              '        if self._config.strategy_type == StrategyType.TOTAL_EVEN:\n'
              '            changes.update(\n'
              '                score=snapshot.score.text(),\n'
              '                total_goals=total_goals(snapshot.score),\n'
              '                total_parity=total_parity(snapshot.score),\n'
              '            )\n'
              '        elif self._config.strategy_type == StrategyType.FIRST_HALF_DRAW:\n'
              '            changes.update(score=snapshot.score.text())\n'
          )
          snapshot_new = (
              '        if self._config.strategy_type == StrategyType.FIRST_HALF_DRAW:\n'
              '            changes.update(score=snapshot.score.text())\n'
          )
          src = replace_required(src, snapshot_block, snapshot_new, 'snapshot total-even branch')
          p.write_text(src, encoding='utf-8')
          ast.parse(src)
          remove_nodes('backend/app/demo/engine.py',
              {'_process_total_even_match', '_wait_for_total_even_market', '_wait_for_total_even_finish'},
              (ast.AsyncFunctionDef,))

          # market + model.
          p = Path('backend/app/browser/market.py')
          src = p.read_text(encoding='utf-8')
          src = replace_required(src,
              'from backend.app.demo.models import FirstHalfDrawMarket, NextGoalOdds, TotalEvenMarket\n',
              'from backend.app.demo.models import FirstHalfDrawMarket, NextGoalOdds\n', 'market models import')
          for line in (
              'TOTAL_EVEN_TEXT = TEXTS.total_even or "Тотал чёт"\n',
              'TOTAL_EVEN_SEARCH_TEXT = TEXTS.total_even_search or "тотал чет"\n',
              'TOTAL_EVEN_SELECTION_TEXT = TEXTS.affirmative_selection or "Да"\n',
          ):
              src = replace_required(src, line, '', line.split(' = ')[0])
          p.write_text(src, encoding='utf-8')
          remove_nodes('backend/app/browser/market.py', {'read_total_even_market'}, (ast.AsyncFunctionDef,))
          remove_nodes('backend/app/demo/models.py', {'TotalEvenMarket'}, (ast.ClassDef,))

          # state/history metadata.
          p = Path('backend/app/demo/state.py')
          src = p.read_text(encoding='utf-8')
          src = src.replace('    "TOTAL_EVEN": ("Тотал чёт", "Тотал чёт", "Да"),\n', '')
          p.write_text(src, encoding='utf-8')
          p = Path('backend/app/demo/history.py')
          src = p.read_text(encoding='utf-8').replace('            "TOTAL_EVEN": summarize("TOTAL_EVEN"),\n', '')
          p.write_text(src, encoding='utf-8')

          # frontend.
          p = Path('front/frontend/src/App.vue')
          src = p.read_text(encoding='utf-8')
          src = src.replace("  if (strategyType === 'TOTAL_EVEN') selectedMode.value = 'DEMO'\n", '')
          src, n = re.subn(r"\n  if \(mode === 'LIVE' && strategyConfig\.value\.strategy_type === 'TOTAL_EVEN'\) \{.*?\n  \}\n", '\n', src, count=1, flags=re.S)
          if n != 1: raise SystemExit('frontend LIVE guard not found')
          src = src.replace("  ['Тотал чёт', state.value.stats?.by_strategy?.TOTAL_EVEN || emptyStats],\n", '')
          src, n = re.subn(r"  TOTAL_EVEN: \{.*?\n  \},\n", '', src, count=1, flags=re.S)
          if n != 1: raise SystemExit('frontend presentation not found')
          src = src.replace(':disabled="!canStart || strategyConfig.strategy_type === \'TOTAL_EVEN\'"', ':disabled="!canStart"')
          src, n = re.subn(r'\n\s*<label :class="\[\'strategy-option\', \{ selected: strategyConfig\.strategy_type === \'TOTAL_EVEN\' \}\]">.*?</label>\n', '\n', src, count=1, flags=re.S)
          if n != 1: raise SystemExit('frontend total-even option not found')
          src, n = re.subn(r'\n\s*<RouterLink class="strategy-option forks-strategy-option" to="/forks">.*?</RouterLink>\n', '\n', src, count=1, flags=re.S)
          if n != 1: raise SystemExit('frontend forks option not found')
          src = src.replace('v-if="!isFirstHalfDraw && state.strategy_type !== \'TOTAL_EVEN\'"', 'v-if="!isFirstHalfDraw"')
          p.write_text(src, encoding='utf-8')

          # tests that remain relevant.
          p = Path('tests/test_api_routes.py')
          p.write_text('''import unittest\n\nfrom backend.app.main import app\n\n\nclass ApiRouteTests(unittest.TestCase):\n    def test_core_lifecycle_routes_are_registered(self):\n        routes = {(route.path, method) for route in app.routes for method in getattr(route, "methods", set())}\n        self.assertIn(("/api/demo/start", "POST"), routes)\n        self.assertIn(("/api/live/start", "POST"), routes)\n        self.assertNotIn(("/api/table-tennis/start", "POST"), routes)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          p = Path('tests/test_strategy.py')
          src = p.read_text(encoding='utf-8')
          src, n = re.subn(r'    def test_strategy_type_defaults_to_next_goal_and_accepts_total_even\(self\):.*?(?=\n    def )', '''    def test_strategy_type_defaults_to_next_goal_and_rejects_removed_total_even(self):\n        self.assertEqual(StrategyConfig.from_payload({}).strategy_type, StrategyType.NEXT_GOAL)\n        self.assertEqual(\n            StrategyConfig.from_payload({"strategy_type": "FIRST_HALF_DRAW"}).strategy_type,\n            StrategyType.FIRST_HALF_DRAW,\n        )\n        with self.assertRaises(ValueError):\n            StrategyConfig.from_payload({"strategy_type": "TOTAL_EVEN"})\n\n''', src, count=1, flags=re.S)
          if n != 1: raise SystemExit('strategy test not found')
          p.write_text(src, encoding='utf-8')

          p = Path('tests/test_selectors.py')
          src = p.read_text(encoding='utf-8')
          for line in ('    TOTAL_EVEN_SEARCH_TEXT,\n', '    TOTAL_EVEN_SELECTION_TEXT,\n', '    TOTAL_EVEN_TEXT,\n'):
              src = src.replace(line, '')
          src = re.sub(r'\n    def test_total_even_dom_labels_are_explicit\(self\):.*?(?=\n\nif __name__)', '', src, count=1, flags=re.S)
          p.write_text(src, encoding='utf-8')

          p = Path('tests/test_frontend_controls.py')
          p.write_text('''import unittest\nfrom pathlib import Path\n\nAPP_VUE = Path(__file__).parents[1] / "front" / "frontend" / "src" / "App.vue"\nROUTER = APP_VUE.parent / "router" / "index.js"\n\n\nclass FrontendControlTests(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        cls.source = APP_VUE.read_text(encoding="utf-8")\n\n    def test_next_goal_blocked_events_checkbox_and_history_label_exist(self):\n        self.assertIn("blocked_events_switch_enabled", self.source)\n        self.assertIn("Заблокированные события", self.source)\n        self.assertIn("item.result === 'MISSED_SELECTED_TEAM_GOAL'", self.source)\n\n    def test_removed_tactics_are_not_exposed(self):\n        router = ROUTER.read_text(encoding="utf-8")\n        self.assertNotIn("/forks", router)\n        self.assertNotIn("TOTAL_EVEN", self.source)\n        self.assertNotIn("Тотал чёт", self.source)\n        self.assertNotIn("Настольный теннис", self.source)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          p = Path('tests/test_url_config.py')
          src = p.read_text(encoding='utf-8')
          src = re.sub(r'\n        forks_source = \(\n            root / "front/frontend/src/views/ForksView.vue"\n        \)\.read_text\(encoding="utf-8"\)\n', '\n', src, count=1)
          src = src.replace('        self.assertIn("fetch(apiUrl(path)", forks_source)\n', '')
          src = src.replace('        self.assertNotIn("127.0.0.1", config_source + app_source + forks_source)\n', '        self.assertNotIn("127.0.0.1", config_source + app_source)\n')
          p.write_text(src, encoding='utf-8')
          PY

          rm -rf backend/app/table_tennis
          rm -f backend/app/routes/table_tennis.py backend/app/demo/strategies/total_even.py
          rm -f front/frontend/src/views/ForksView.vue
          rm -f tests/test_total_even.py tests/test_table_tennis_*.py
          rm -f .github/workflows/audit-unused-strategies.yml
          rm -f .github/workflows/remove-obsolete-strategies-once-2.yml

      - name: Verify source cleanup
        run: |
          python -m compileall -q backend tests xbet_config.py auth.py matches.py
          ! grep -R -E 'StrategyType\.TOTAL_EVEN|read_total_even_market|TotalEvenMarket|backend\.app\.table_tennis|to="/forks"' backend/app front/frontend/src --include='*.py' --include='*.vue' --include='*.js'
          ! test -e backend/app/table_tennis
          ! test -e backend/app/routes/table_tennis.py
          ! test -e backend/app/demo/strategies/total_even.py
          ! test -e front/frontend/src/views/ForksView.vue

      - name: Install and run all backend tests
        run: |
          cp .env.example .env
          pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Build frontend
        working-directory: front/frontend
        run: |
          npm ci
          npm run build

      - name: Commit verified cleanup
        run: |
          rm .github/workflows/remove-obsolete-strategies-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove total-even and tennis forks"
          git push origin HEAD:feature/hybrid-odds-vision
