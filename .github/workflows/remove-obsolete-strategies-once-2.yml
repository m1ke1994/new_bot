name: remove-obsolete-strategies-once-2

on:
  push:
    branches:
      - feature/hybrid-odds-vision
    paths:
      - .github/workflows/remove-obsolete-strategies-once-2.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hybrid-odds-vision
          fetch-depth: 0

      - name: Remove obsolete implementations
        run: |
          python - <<'PY'
          from __future__ import annotations
          import ast
          import re
          from pathlib import Path

          def remove_line_ranges(path: str, ranges: list[tuple[int, int]]) -> None:
              p = Path(path)
              source = p.read_text(encoding='utf-8')
              lines = source.splitlines(keepends=True)
              covered = set()
              for start, end in ranges:
                  covered.update(range(start - 1, end))
              p.write_text(''.join(line for i, line in enumerate(lines) if i not in covered), encoding='utf-8')

          engine_path = Path('backend/app/demo/engine.py')
          engine = engine_path.read_text(encoding='utf-8')
          tree = ast.parse(engine)
          ranges = []
          obsolete_methods = {'_process_total_even_match', '_wait_for_total_even_market', '_wait_for_total_even_finish'}
          for node in ast.walk(tree):
              if isinstance(node, ast.ImportFrom):
                  if node.module == 'strategies.total_even':
                      ranges.append((node.lineno, node.end_lineno))
                  if node.module == 'backend.app.table_tennis.scanner':
                      ranges.append((node.lineno, node.end_lineno))
              elif isinstance(node, ast.AsyncFunctionDef) and node.name in obsolete_methods:
                  ranges.append((node.lineno, node.end_lineno))
              elif isinstance(node, ast.If):
                  test = ast.unparse(node.test)
                  if 'StrategyType.TOTAL_EVEN' in test or 'TABLE_TENNIS_SCANNER.scanning' in test:
                      ranges.append((node.lineno, node.end_lineno))
          remove_line_ranges(str(engine_path), ranges)
          engine = engine_path.read_text(encoding='utf-8')
          engine = engine.replace('    read_total_even_market,\n', '')
          engine = engine.replace(
              '        # The read-only table-tennis scanner shares this exact Playwright page.\n'
              '        # Never let two independent workflows navigate it concurrently.\n',
              '',
          )
          engine_path.write_text(engine, encoding='utf-8')
          ast.parse(engine)
          for token in ('TOTAL_EVEN', 'total_even', 'TABLE_TENNIS_SCANNER', 'backend.app.table_tennis'):
              if token in engine:
                  raise SystemExit(f'engine cleanup incomplete: {token}')

          market_path = Path('backend/app/browser/market.py')
          market = market_path.read_text(encoding='utf-8')
          market = market.replace(
              'from backend.app.demo.models import FirstHalfDrawMarket, NextGoalOdds, TotalEvenMarket\n',
              'from backend.app.demo.models import FirstHalfDrawMarket, NextGoalOdds\n',
          )
          market_path.write_text(market, encoding='utf-8')
          tree = ast.parse(market)
          ranges = []
          for node in ast.walk(tree):
              if isinstance(node, (ast.Assign, ast.AnnAssign)):
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  names = [t.id for t in targets if isinstance(t, ast.Name)]
                  if any(name.startswith('TOTAL_EVEN_') for name in names):
                      ranges.append((node.lineno, node.end_lineno))
              elif isinstance(node, ast.AsyncFunctionDef) and node.name == 'read_total_even_market':
                  ranges.append((node.lineno, node.end_lineno))
          remove_line_ranges(str(market_path), ranges)
          market = market_path.read_text(encoding='utf-8')
          ast.parse(market)
          for token in ('TOTAL_EVEN', 'TotalEvenMarket', 'read_total_even_market', 'Тотал чёт'):
              if token in market:
                  raise SystemExit(f'market cleanup incomplete: {token}')

          models_path = Path('backend/app/demo/models.py')
          models = models_path.read_text(encoding='utf-8')
          tree = ast.parse(models)
          ranges = [(node.lineno, node.end_lineno) for node in ast.walk(tree) if isinstance(node, ast.ClassDef) and node.name == 'TotalEvenMarket']
          remove_line_ranges(str(models_path), ranges)
          models = models_path.read_text(encoding='utf-8')
          ast.parse(models)
          if 'TotalEvenMarket' in models or 'Тотал чёт' in models:
              raise SystemExit('TotalEvenMarket cleanup incomplete')

          state_path = Path('backend/app/demo/state.py')
          state = state_path.read_text(encoding='utf-8').replace('    "TOTAL_EVEN": ("Тотал чёт", "Тотал чёт", "Да"),\n', '')
          state_path.write_text(state, encoding='utf-8')

          history_path = Path('backend/app/demo/history.py')
          history = history_path.read_text(encoding='utf-8').replace('            "TOTAL_EVEN": summarize("TOTAL_EVEN"),\n', '')
          history_path.write_text(history, encoding='utf-8')

          app_path = Path('front/frontend/src/App.vue')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace("  if (strategyType === 'TOTAL_EVEN') selectedMode.value = 'DEMO'\n", '')
          start = app.find("  if (mode === 'LIVE' && strategyConfig.value.strategy_type === 'TOTAL_EVEN') {")
          if start != -1:
              end = app.find("  selectedMode.value = mode", start)
              if end == -1:
                  raise SystemExit('could not find TOTAL_EVEN startMode block end')
              app = app[:start] + app[end:]
          app = app.replace("  ['Тотал чёт', state.value.stats?.by_strategy?.TOTAL_EVEN || emptyStats],\n", '')
          start = app.find("  TOTAL_EVEN: {")
          if start != -1:
              end = app.find("  FIRST_HALF_DRAW: {", start)
              if end == -1:
                  raise SystemExit('could not find TOTAL_EVEN presentation block end')
              app = app[:start] + app[end:]
          app = app.replace(':disabled="!canStart || strategyConfig.strategy_type === \'TOTAL_EVEN\'"', ':disabled="!canStart"')
          start = app.find("            <label :class=\"['strategy-option', { selected: strategyConfig.strategy_type === 'TOTAL_EVEN' }]\">")
          if start != -1:
              end = app.find('            </label>', start)
              if end == -1:
                  raise SystemExit('could not find TOTAL_EVEN label end')
              app = app[:start] + app[end + len('            </label>'):]
          start = app.find('            <RouterLink class="strategy-option forks-strategy-option" to="/forks">')
          if start != -1:
              end = app.find('            </RouterLink>', start)
              if end == -1:
                  raise SystemExit('could not find forks RouterLink end')
              app = app[:start] + app[end + len('            </RouterLink>'):]
          app = app.replace('              <div v-if="!isFirstHalfDraw && state.strategy_type !== \'TOTAL_EVEN\'">', '              <div v-if="!isFirstHalfDraw">')
          app_path.write_text(app, encoding='utf-8')
          for token in ('TOTAL_EVEN', 'Тотал чёт', 'to="/forks"', '>Вилки<', 'Настольный теннис'):
              if token in app:
                  raise SystemExit(f'App.vue cleanup incomplete: {token}')

          Path('tests/test_api_routes.py').write_text(
              'import unittest\n\nfrom backend.app.main import app\n\n\nclass ApiRouteTests(unittest.TestCase):\n    def test_core_lifecycle_routes_are_registered(self):\n        routes = {(route.path, method) for route in app.routes for method in getattr(route, "methods", set())}\n        self.assertIn(("/api/demo/start", "POST"), routes)\n        self.assertIn(("/api/live/start", "POST"), routes)\n        self.assertNotIn(("/api/table-tennis/start", "POST"), routes)\n\n\nif __name__ == "__main__":\n    unittest.main()\n',
              encoding='utf-8',
          )
          Path('tests/test_frontend_controls.py').write_text(
              'import unittest\nfrom pathlib import Path\n\nAPP_VUE = Path(__file__).parents[1] / "front" / "frontend" / "src" / "App.vue"\nROUTER = APP_VUE.parent / "router" / "index.js"\n\n\nclass FrontendControlTests(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        cls.source = APP_VUE.read_text(encoding="utf-8")\n\n    def test_next_goal_blocked_events_checkbox_and_history_label_exist(self):\n        self.assertIn("blocked_events_switch_enabled", self.source)\n        self.assertIn("Заблокированные события", self.source)\n        self.assertIn("Контролировать пропущенный гол выбранной команды", self.source)\n        self.assertIn("item.result === \'MISSED_SELECTED_TEAM_GOAL\'", self.source)\n\n    def test_removed_tactics_are_not_exposed(self):\n        router = ROUTER.read_text(encoding="utf-8")\n        self.assertNotIn("/forks", router)\n        self.assertNotIn("TOTAL_EVEN", self.source)\n        self.assertNotIn("Тотал чёт", self.source)\n        self.assertNotIn("Настольный теннис", self.source)\n\n\nif __name__ == "__main__":\n    unittest.main()\n',
              encoding='utf-8',
          )

          strategy_test = Path('tests/test_strategy.py')
          text = strategy_test.read_text(encoding='utf-8')
          pattern = re.compile(r'    def test_strategy_type_defaults_to_next_goal_and_accepts_total_even\(self\):.*?(?=\n    def )', re.S)
          replacement = '    def test_strategy_type_defaults_to_next_goal_and_rejects_removed_total_even(self):\n        self.assertEqual(StrategyConfig.from_payload({}).strategy_type, StrategyType.NEXT_GOAL)\n        self.assertEqual(\n            StrategyConfig.from_payload({"strategy_type": "FIRST_HALF_DRAW"}).strategy_type,\n            StrategyType.FIRST_HALF_DRAW,\n        )\n        with self.assertRaises(ValueError):\n            StrategyConfig.from_payload({"strategy_type": "TOTAL_EVEN"})\n\n'
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'failed to update strategy test, count={count}')
          strategy_test.write_text(text, encoding='utf-8')

          selectors_test = Path('tests/test_selectors.py')
          text = selectors_test.read_text(encoding='utf-8')
          for name in ('    TOTAL_EVEN_SEARCH_TEXT,\n', '    TOTAL_EVEN_SELECTION_TEXT,\n', '    TOTAL_EVEN_TEXT,\n'):
              text = text.replace(name, '')
          text = re.sub(r'\n    def test_total_even_dom_labels_are_explicit\(self\):.*?(?=\n\nif __name__)', '', text, count=1, flags=re.S)
          selectors_test.write_text(text, encoding='utf-8')

          url_test = Path('tests/test_url_config.py')
          text = url_test.read_text(encoding='utf-8')
          text = re.sub(r'\n        forks_source = \(\n            root / "front/frontend/src/views/ForksView.vue"\n        \)\.read_text\(encoding="utf-8"\)\n', '\n', text, count=1)
          text = text.replace('        self.assertIn("fetch(apiUrl(path)", forks_source)\n', '')
          text = text.replace('        self.assertNotIn("127.0.0.1", config_source + app_source + forks_source)\n', '        self.assertNotIn("127.0.0.1", config_source + app_source)\n')
          url_test.write_text(text, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = re.sub(r'(?ms)^## Вилки настольного тенниса \(DEMO\).*?(?=^## |\Z)', '', readme, count=1)
          readme_path.write_text(readme, encoding='utf-8')
          PY

          rm -f backend/app/demo/strategies/total_even.py
          rm -f backend/app/routes/table_tennis.py
          rm -rf backend/app/table_tennis
          rm -f front/frontend/src/views/ForksView.vue
          rm -f tests/test_total_even.py
          rm -f tests/test_table_tennis_*.py
          rm -f .github/workflows/audit-unused-strategies.yml

      - name: Verify removed implementations are unreachable
        run: |
          python -m compileall -q backend tests xbet_config.py auth.py matches.py
          ! git grep -n -E 'backend\.app\.table_tennis|/api/table-tennis|ForksView|to="/forks"' -- ':!*.env' ':!.env*' ':!.github/workflows/remove-obsolete-strategies-once-2.yml'
          ! git grep -n -E 'StrategyType\.TOTAL_EVEN|read_total_even_market|TotalEvenMarket|strategies\.total_even' -- ':!*.env' ':!.env*' ':!.github/workflows/remove-obsolete-strategies-once-2.yml'

      - name: Run focused tests
        run: |
          cp .env.example .env
          python -m pip install --quiet -r requirements.txt
          python -m unittest tests.test_api_routes tests.test_strategy tests.test_selectors tests.test_frontend_controls tests.test_frontend_bet_contract tests.test_hybrid_market_vision tests.test_live_executor tests.test_next_goal_blocked_switch -v

      - name: Commit cleanup
        run: |
          rm .github/workflows/remove-obsolete-strategies-once-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove obsolete total-even and tennis-forks implementations"
          git push origin HEAD:feature/hybrid-odds-vision
