name: remove-obsolete-strategies-once

on:
  push:
    branches:
      - feature/hybrid-odds-vision
    paths:
      - .github/workflows/remove-obsolete-strategies-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hybrid-odds-vision
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Remove obsolete implementations
        run: |
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return source.replace(old, new, 1)

          def remove_ast_nodes(path: str, names: set[str], kinds: tuple[type, ...]) -> None:
              p = Path(path)
              source = p.read_text(encoding='utf-8')
              tree = ast.parse(source)
              spans = []
              found = set()
              for node in ast.walk(tree):
                  if isinstance(node, kinds) and getattr(node, 'name', None) in names:
                      start = min([node.lineno, *[d.lineno for d in getattr(node, 'decorator_list', [])]])
                      spans.append((start, node.end_lineno, node.name))
                      found.add(node.name)
              missing = names - found
              if missing:
                  raise SystemExit(f'{path}: AST nodes not found: {sorted(missing)}')
              lines = source.splitlines(keepends=True)
              for start, end, _name in sorted(spans, reverse=True):
                  del lines[start - 1:end]
                  while start - 1 < len(lines) and lines[start - 1].strip() == '':
                      del lines[start - 1]
              p.write_text(''.join(lines), encoding='utf-8')

          # --- DemoEngine: remove total-even execution and table-tennis runtime coupling.
          engine_path = Path('backend/app/demo/engine.py')
          engine = engine_path.read_text(encoding='utf-8')
          engine = replace_once(
              engine,
              '    read_next_goal_odds,\n    read_total_even_market,\n',
              '    read_next_goal_odds,\n',
              'engine market import',
          )
          total_import = re.compile(
              r'from \.strategies\.total_even import \(\n.*?\n\)\n',
              re.DOTALL,
          )
          engine, count = total_import.subn('', engine, count=1)
          if count != 1:
              raise SystemExit(f'engine total_even import: expected 1, found {count}')
          engine = replace_once(
              engine,
              'def strategy_market_presentation(strategy_type: StrategyType) -> tuple[str, str | None]:\n'
              '    if strategy_type == StrategyType.TOTAL_EVEN:\n'
              '        return TOTAL_EVEN_MARKET_NAME, TOTAL_EVEN_SELECTION\n'
              '    if strategy_type == StrategyType.FIRST_HALF_DRAW:\n',
              'def strategy_market_presentation(strategy_type: StrategyType) -> tuple[str, str | None]:\n'
              '    if strategy_type == StrategyType.FIRST_HALF_DRAW:\n',
              'engine market presentation',
          )
          engine = replace_once(
              engine,
              '        # The read-only table-tennis scanner shares this exact Playwright page.\n'
              '        # Never let two independent workflows navigate it concurrently.\n'
              '        from backend.app.table_tennis.scanner import TABLE_TENNIS_SCANNER\n\n'
              '        if TABLE_TENNIS_SCANNER.scanning:\n'
              '            raise ModeConflictError(\n'
              '                "Сначала остановите DEMO «Вилки» и общий Playwright browser."\n'
              '            )\n',
              '',
              'engine tennis start guard',
          )
          engine = replace_once(
              engine,
              '            if (\n'
              '                requested_mode == "LIVE"\n'
              '                and self._config.strategy_type == StrategyType.TOTAL_EVEN\n'
              '            ):\n'
              '                raise ModeConflictError(\n'
              '                    "Стратегия «Тотал чёт» пока доступна только в DEMO."\n'
              '                )\n',
              '',
              'engine total-even LIVE guard',
          )
          engine = replace_once(
              engine,
              '        if self._config.strategy_type == StrategyType.TOTAL_EVEN:\n'
              '            await self._process_total_even_match(page)\n'
              '            return\n',
              '',
              'engine total-even dispatch',
          )
          engine_path.write_text(engine, encoding='utf-8')
          remove_ast_nodes(
              'backend/app/demo/engine.py',
              {'_process_total_even_match', '_wait_for_total_even_market', '_wait_for_total_even_finish'},
              (ast.AsyncFunctionDef,),
          )
          engine = engine_path.read_text(encoding='utf-8')
          if 'TOTAL_EVEN' in engine or 'table_tennis' in engine:
              raise SystemExit('engine cleanup incomplete')

          # --- Market reader/model: remove the unused total-even market implementation.
          market_path = Path('backend/app/browser/market.py')
          market = market_path.read_text(encoding='utf-8')
          market = replace_once(
              market,
              'from backend.app.demo.models import FirstHalfDrawMarket, NextGoalOdds, TotalEvenMarket\n',
              'from backend.app.demo.models import FirstHalfDrawMarket, NextGoalOdds\n',
              'market model import',
          )
          for old in (
              'TOTAL_EVEN_TEXT = TEXTS.total_even or "Тотал чёт"\n',
              'TOTAL_EVEN_SEARCH_TEXT = TEXTS.total_even_search or "тотал чет"\n',
              'TOTAL_EVEN_SELECTION_TEXT = TEXTS.affirmative_selection or "Да"\n',
          ):
              market = replace_once(market, old, '', f'market constant {old.split(" = ")[0]}')
          market_path.write_text(market, encoding='utf-8')
          remove_ast_nodes('backend/app/browser/market.py', {'read_total_even_market'}, (ast.AsyncFunctionDef,))
          if 'TOTAL_EVEN' in market_path.read_text(encoding='utf-8'):
              raise SystemExit('market total-even cleanup incomplete')

          remove_ast_nodes('backend/app/demo/models.py', {'TotalEvenMarket'}, (ast.ClassDef,))

          # --- Frontend: remove total-even selector and tennis forks page/link.
          app_path = Path('front/frontend/src/App.vue')
          app = app_path.read_text(encoding='utf-8')
          app = replace_once(
              app,
              "  ['Тотал чёт', state.value.stats?.by_strategy?.TOTAL_EVEN || emptyStats],\n",
              '',
              'frontend total-even stats',
          )
          app = replace_once(
              app,
              "  TOTAL_EVEN: {\n    name: 'Тотал чёт',\n    description: 'Ставка на «Тотал чёт — Да». Результат зависит от чётности общего количества голов.',\n  },\n",
              '',
              'frontend total-even presentation',
          )
          app = replace_once(
              app,
              "\n  if (strategyType === 'TOTAL_EVEN') selectedMode.value = 'DEMO'\n",
              '',
              'frontend total-even mode coercion',
          )
          live_guard = re.compile(
              r"\n  if \(mode === 'LIVE' && strategyConfig\.value\.strategy_type === 'TOTAL_EVEN'\) \{\n.*?\n  \}\n",
              re.DOTALL,
          )
          app, count = live_guard.subn('\n', app, count=1)
          if count != 1:
              raise SystemExit(f'frontend LIVE total-even guard: expected 1, found {count}')
          app = replace_once(
              app,
              ':disabled="!canStart || strategyConfig.strategy_type === \'TOTAL_EVEN\'"',
              ':disabled="!canStart"',
              'frontend LIVE button guard',
          )
          total_label = re.compile(
              r'\n\s*<label :class="\[\'strategy-option\', \{ selected: strategyConfig\.strategy_type === \'TOTAL_EVEN\' \}\]">.*?</label>\n',
              re.DOTALL,
          )
          app, count = total_label.subn('\n', app, count=1)
          if count != 1:
              raise SystemExit(f'frontend total-even option: expected 1, found {count}')
          forks_link = re.compile(
              r'\n\s*<RouterLink class="strategy-option forks-strategy-option" to="/forks">.*?</RouterLink>\n',
              re.DOTALL,
          )
          app, count = forks_link.subn('\n', app, count=1)
          if count != 1:
              raise SystemExit(f'frontend forks link: expected 1, found {count}')
          app = app.replace(
              'v-if="!isFirstHalfDraw && state.strategy_type !== \'TOTAL_EVEN\'"',
              'v-if="!isFirstHalfDraw"',
          )
          if 'TOTAL_EVEN' in app or 'to="/forks"' in app or 'Тотал чёт' in app:
              raise SystemExit('frontend obsolete strategy cleanup incomplete')
          app_path.write_text(app, encoding='utf-8')

          # --- Keep useful API/strategy tests, but align them with the reduced product.
          api_test = Path('tests/test_api_routes.py')
          api_source = api_test.read_text(encoding='utf-8')
          api_source = re.sub(
              r'\n\s*self\.assertIn\(\("/api/table-tennis/.*?\n',
              '\n',
              api_source,
          )
          api_test.write_text(api_source, encoding='utf-8')

          strategy_test = Path('tests/test_strategy.py')
          strategy_source = strategy_test.read_text(encoding='utf-8')
          old_test = '''    def test_strategy_type_defaults_to_next_goal_and_accepts_total_even(self):\n        self.assertEqual(StrategyConfig.from_payload({}).strategy_type, StrategyType.NEXT_GOAL)\n        self.assertEqual(\n            StrategyConfig.from_payload({"strategy_type": "TOTAL_EVEN"}).strategy_type,\n            StrategyType.TOTAL_EVEN,\n        )\n\n'''
          new_test = '''    def test_strategy_type_defaults_to_next_goal_and_rejects_removed_total_even(self):\n        self.assertEqual(StrategyConfig.from_payload({}).strategy_type, StrategyType.NEXT_GOAL)\n        with self.assertRaises(ValueError):\n            StrategyConfig.from_payload({"strategy_type": "TOTAL_EVEN"})\n\n'''
          strategy_source = replace_once(strategy_source, old_test, new_test, 'strategy type test')
          strategy_test.write_text(strategy_source, encoding='utf-8')
          PY

          rm -rf backend/app/table_tennis
          rm -f backend/app/routes/table_tennis.py
          rm -f backend/app/demo/strategies/total_even.py
          rm -f front/frontend/src/views/ForksView.vue
          rm -f tests/test_total_even.py
          rm -f tests/test_table_tennis_*.py

      - name: Guard removed modules
        run: |
          ! test -e backend/app/table_tennis
          ! test -e backend/app/routes/table_tennis.py
          ! test -e backend/app/demo/strategies/total_even.py
          ! test -e front/frontend/src/views/ForksView.vue
          ! grep -R "TOTAL_EVEN\|table_tennis\|/forks\|table-tennis" backend/app front/frontend/src tests --include='*.py' --include='*.vue' --include='*.js'

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt
          cp .env.example .env

      - name: Run backend tests
        run: python -m unittest discover -s tests -v

      - name: Build frontend
        working-directory: front/frontend
        run: |
          npm ci
          npm run build

      - name: Commit verified cleanup
        run: |
          rm .github/workflows/remove-obsolete-strategies-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove total-even and tennis forks strategies"
          git push origin HEAD:feature/hybrid-odds-vision
